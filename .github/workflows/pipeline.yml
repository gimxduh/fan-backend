name: Fan Backend Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies from Nexus
        run: |
          pip install -r requirements.txt --index-url http://${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASS }}@172.23.11.110:8081/repository/pypi-proxy/simple/ --trusted-host 172.23.11.110 --timeout 120
        shell: powershell

      - name: Run tests
        run: |
          if (Test-Path tests/) {
            pip install pytest
            pytest tests/ -v
          } else {
            Write-Host "No tests directory found, skipping..."
          }
        shell: powershell

      - name: Download IQ CLI from Nexus
        run: |
          curl.exe -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASS }}" -o nexus-iq-cli.jar http://172.23.11.110:8081/repository/raw-hosted/tools/nexus-iq-cli.jar
        shell: powershell

      - name: Download packages for IQ scan
        run: |
          pip download -r requirements.txt -d ./packages --timeout 120
        shell: powershell

      - name: IQ Server scan
        run: |
          java -jar nexus-iq-cli.jar -s http://172.23.11.33:8070 -a ${{ secrets.IQ_USER }}:${{ secrets.IQ_PASS }} -i fan-backend -t build ./packages
        shell: powershell

      - name: Package application
        run: |
          Compress-Archive -Path * -DestinationPath fan-backend-${{ github.sha }}.zip -Force
        shell: powershell

      - name: Push to Nexus
        run: |
          curl.exe -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASS }}" --upload-file fan-backend-${{ github.sha }}.zip http://172.23.11.110:8081/repository/raw-hosted/fan-backend/fan-backend-${{ github.sha }}.zip
        shell: powershell

      - name: Print artifact URL
        run: |
          Write-Host "✅ Artifact pushed to Nexus:"
          Write-Host "http://172.23.11.110:8081/repository/raw-hosted/fan-backend/fan-backend-${{ github.sha }}.zip"
        shell: powershell